name: Bug report
description: Report a reproducible problem in Media Gen
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private endpoints, customer media, or other
        sensitive data. Follow SECURITY.md instead for vulnerabilities.

  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed secrets, private data, and sensitive media.
          required: true
        - label: I agree to follow the Code of Conduct.
          required: true

  - type: input
    attributes:
      label: Media Gen version
      description: The version from package.json or the revision you built.
      placeholder: 0.1.1 or a commit SHA
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: input
    attributes:
      label: Node.js version
      placeholder: Output of node --version
    validations:
      required: true

  - type: textarea
    attributes:
      label: Reproduction
      description: List the smallest set of steps that reproduces the problem.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    attributes:
      label: Redacted diagnostics
      description: Include relevant errors or mg doctor output after removing sensitive values.
      render: shell
